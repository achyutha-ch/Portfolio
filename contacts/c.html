<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager Pro</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 p-6">

    <div class="max-w-5xl mx-auto">

        <!-- Header -->
        <div class="bg-white/20 backdrop-blur-lg rounded-3xl p-6 shadow-xl mb-6">

            <h1 class="text-4xl font-bold text-white text-center">
                <i class="fa-solid fa-address-book"></i>
                Contact Manager Pro
            </h1>

            <p class="text-center text-gray-100 mt-2">
                Store and manage your contacts efficiently
            </p>

        </div>

        <!-- Form -->
        <div class="bg-white rounded-3xl shadow-2xl p-6 mb-6">

            <div class="grid md:grid-cols-3 gap-4">

                <input
                    id="nameInput"
                    type="text"
                    placeholder="Full Name"
                    class="p-3 border rounded-xl">

                <input
                    id="phoneInput"
                    type="text"
                    placeholder="Phone Number"
                    class="p-3 border rounded-xl">

                <input
                    id="emailInput"
                    type="email"
                    placeholder="Email Address"
                    class="p-3 border rounded-xl">

            </div>

            <div class="flex gap-4 mt-4">

                <button
                    onclick="addContact()"
                    class="bg-indigo-600 text-white px-6 py-3 rounded-xl hover:bg-indigo-700">
                    <i class="fa-solid fa-plus"></i>
                    Add Contact
                </button>

                <input
                    id="searchInput"
                    type="text"
                    placeholder="Search Contacts..."
                    class="flex-1 p-3 border rounded-xl">
            </div>

        </div>

        <!-- Stats -->
        <div class="grid grid-cols-3 gap-4 mb-6">

            <div class="bg-white rounded-2xl p-4 text-center shadow-lg">
                <h3>Total Contacts</h3>
                <p id="contactCount" class="text-3xl font-bold text-indigo-600">0</p>
            </div>

            <div class="bg-white rounded-2xl p-4 text-center shadow-lg">
                <h3>Emails</h3>
                <p id="emailCount" class="text-3xl font-bold text-green-600">0</p>
            </div>

            <div class="bg-white rounded-2xl p-4 text-center shadow-lg">
                <h3>Phone Numbers</h3>
                <p id="phoneCount" class="text-3xl font-bold text-pink-600">0</p>
            </div>

        </div>

        <!-- Contact List -->
        <div
            id="contactsContainer"
            class="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
        </div>

    </div>

    <script src="c.js"></script>

</body>
</html>
